# Keep the original Compose project name so an existing development database
# remains available after moving the sandbox out of tracezilla-woocommerce-php.
name: tracezilla-woocommerce-php

services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - wordpress-database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    # Keep the image tag in sync with WORDPRESS_VERSION in the wp-cli service.
    image: wordpress:7.1.3-php8.3-apache
    depends_on:
      database:
        condition: service_healthy
    ports:
      # Reachable from the integration container through host.docker.internal,
      # and therefore from your local network. The sandbox uses well-known
      # credentials: do not run it on an untrusted network.
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-files:/var/www/html
      - ./mu-plugins/sandbox-rest-over-http.php:/var/www/html/wp-content/mu-plugins/sandbox-rest-over-http.php:ro

  wp-cli:
    image: wordpress:cli-2.12.0-php8.3
    user: "33:33"
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      HOME: /tmp
      # setup.sh upgrades existing volumes to these versions on every start.
      WORDPRESS_VERSION: 7.1.3
      WOOCOMMERCE_VERSION: 11.2.1
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-files:/var/www/html
      - ./setup.sh:/setup.sh:ro
      - ./seed-products.php:/seed-products.php:ro
      - ./seed-api-key.php:/seed-api-key.php:ro
    entrypoint: [sh, /setup.sh]

volumes:
  wordpress-database:
  wordpress-files:
