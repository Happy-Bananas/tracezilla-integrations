# Keep the original Compose project name so an existing development database
# remains available after moving the sandbox out of tracezilla-woocommerce-php.
name: tracezilla-woocommerce-php

services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - wordpress-database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.9.1-php8.3-apache
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-files:/var/www/html

  wp-cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-files:/var/www/html
      - ./setup.sh:/setup.sh:ro
      - ./seed-products.php:/seed-products.php:ro
    entrypoint: [sh, /setup.sh]

volumes:
  wordpress-database:
  wordpress-files:
